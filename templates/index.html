<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI OS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f7fb;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:420px;
            background:white;
            border-radius:18px;
            padding:45px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.08);
        }

        h1{
            font-size:32px;
            margin-bottom:10px;
            color:#111827;
        }

        p{
            color:#6b7280;
            margin-bottom:35px;
            line-height:1.6;
        }

        .google-btn{
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            text-decoration:none;
            background:white;
            color:#222;
            padding:15px;
            border-radius:12px;
            border:1px solid #ddd;
            font-size:17px;
            font-weight:600;
            transition:.2s;
        }

        .google-btn:hover{
            background:#f2f2f2;
        }

        .google-icon{
            width:24px;
            height:24px;
        }

        .footer{
            margin-top:30px;
            font-size:13px;
            color:#999;
        }

        .logo{
            width:70px;
            height:70px;
            border-radius:50%;
            background:#2563eb;
            color:white;
            margin:auto;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            margin-bottom:25px;
        }
    </style>

</head>

<body>

<div class="card">

    <div class="logo">
        AI
    </div>

    <h1>Enterprise AI OS</h1>

    <p>
        Connect your Google account once and let your AI securely access
        Gmail, Calendar, Drive, Docs, and more.
    </p>

    <a href="/login" class="google-btn">

        <img
        class="google-icon"
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">

        Continue with Google

    </a>

    <div class="footer">

        By continuing you agree to our Terms & Privacy Policy.

    </div>

</div>

</body>

</html>
